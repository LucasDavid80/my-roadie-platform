name: My Roadie Ecosystem CI/CD

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Escopo de execução dos jobs'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - backend
          - frontend
          - mobile
      backend_url:
        description: 'URL do backend para injeção nos builds mobile'
        required: false
        default: 'https://my-roadie-backend.onrender.com'
        type: string
      run_mobile_e2e:
        description: 'Executar testes E2E com Emulador Mobile (Consome mais minutos de CI)'
        required: false
        default: false
        type: boolean

jobs:
  # ==========================================
  # PATHS FILTER JOB
  # ==========================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'prisma/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend-web/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  # ==========================================
  # LINTS JOBS
  # ==========================================
  frontend-lint:
    name: Frontend Lint
    needs: changes
    if: |
      inputs.scope == 'all' ||
      inputs.scope == 'frontend' ||
      ((inputs.scope == 'auto' || !inputs.scope) && needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend-web/package-lock.json'
      - run: npm ci
      - run: npm run lint
  
  backend-lint:
    name: Backend Lint
    needs: changes
    if: |
      inputs.scope == 'all' ||
      inputs.scope == 'backend' ||
      ((inputs.scope == 'auto' || !inputs.scope) && needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  mobile-lint:
    name: Mobile Lint
    needs: changes
    if: |
      inputs.scope == 'all' ||
      inputs.scope == 'mobile' ||
      ((inputs.scope == 'auto' || !inputs.scope) && needs.changes.outputs.mobile == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  # ==========================================
  # TEST JOBS
  # ==========================================
  frontend-test:
    needs: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend-web/package-lock.json'
      - run: npm ci
      - run: npm test -- --run

  frontend-e2e:
    needs: frontend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-web
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend-web/package-lock.json'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  backend-test:
    needs: backend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  backend-e2e:
    needs: backend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:e2e

  mobile-test:
    needs: mobile-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter test

  mobile-e2e-emulator:
    name: Mobile E2E Emulator (Spec 018)
    needs: mobile-test
    if: github.event.inputs.run_mobile_e2e == 'true' || inputs.run_mobile_e2e == true
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Placeholder para suíte de testes E2E Mobile (Spec 018)
        run: |
          echo "Hook de E2E Mobile sob demanda ativado."
          echo "Os cenários detalhados com emulador serão implementados na Spec 018."

  # ==========================================
  # BUILD JOBS
  # ==========================================
  frontend-build:
    needs: frontend-e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-web
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend-web/package-lock.json'
      - run: npm ci
      - run: npm run build

  backend-build:
    needs: backend-e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  mobile-android-build:
    name: Mobile Android Build
    needs: mobile-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=BACKEND_URL=${{ inputs.backend_url || 'https://my-roadie-backend.onrender.com' }}
      - name: Publicar Artefato Android (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: my-roadie-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  mobile-ios-build:
    needs: mobile-test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=BACKEND_URL=https://my-roadie-backend.onrender.com
      - name: Empacotar IPA para Sideload
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r my-roadie-release.ipa Payload
      - name: Publicar Artefato iOS (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: my-roadie-ios-release-ipa
          path: mobile/my-roadie-release.ipa
          retention-days: 7

  # ==========================================
  # DEPLOY JOBS (Continuous Deployment)
  # ==========================================
  deploy-production:
    name: Deploy to Production
    needs: [frontend-build, backend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Backend Deploy (Render)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Disparando deploy do Backend no Render..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "Aviso: RENDER_DEPLOY_HOOK não configurado nos secrets do GitHub. Ignorando."
          fi

      - name: Trigger Frontend Deploy (Vercel)
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Disparando deploy do Frontend na Vercel..."
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
          else
            echo "Aviso: VERCEL_DEPLOY_HOOK não configurado nos secrets do GitHub. Ignorando."
          fi
